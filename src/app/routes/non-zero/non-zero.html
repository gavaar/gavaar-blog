<div class="non-zero" *gav-require-auth>
  <day-tracker />

  @if (loading()) {
    <gav-loading />
  } @else {
    <div class="non-zero__cards">
      @for (habit of habits(); track habit.id) {
        @if (editing[habit.id]) {
          <habit-edit-card
            [habitId]="habit.id"
            (cancel)="editing[habit.id] = false"
          />
        } @else {
          <habit-card [habit]="habit" (editHabit)="editing[habit.id] = true" />
        }
      }
  
      <habit-edit-card />
    </div>
  }
</div>
