@let selectedEffort = cardValues().effort;

<div
  class="habit-card"
  [class.disabled]="disableCard()"
  [style.--habit-card-selection]="`var(--habit-card-color_${selectedEffort}, var(--disabled))`"
>
  <habit-card-header
    class="habit-card__header"
    [icon]="habit().icon"
    [title]="habit().title"
    [id]="habit().id"
    [description]="habit().description"
    [open]="open()"
    [showCaret]="selectedTask()?.effort != null"
    (click)="toggleMinimize()"
  />

  <div class="habit-card__slider">
    <div class="habit-card__slider-effot">
      {{ selectedEffort === '' ? '-' : selectedEffort }}
    </div>

    @if (open()) {
      <gav-input
        [style.--anim__max-height]="'10rem'"
        animate.enter="slide-y__grow"
        animate.leave="slide-y__shrink"
        type="slider"
        [formField]="cardValuesForm.effort"
      />
    }
  </div>

  <habit-card-goal
    [formField]="cardValuesForm.goal"
    [goal]="habit().currentGoal?.title"
    [open]="open()"
  />

  <habit-card-history 
    [open]="open()"
    [latestTasks]="habit().latestTasks || {}"
  />
  @if (open()) {
    <habit-card-input
      [style.--anim__max-height]="'3rem'"
      animate.enter="slide-y__grow"
      animate.leave="slide-y__shrink"
      [formField]="cardValuesForm.context"
      />
      
    <habit-card-actions
      animate.enter="slide-y__grow"
      animate.leave="slide-y__shrink"
      [style.--anim__max-height]="'1.5rem'"
      (onDelete)="deleteHabit()"
      (onEdit)="editHabit.emit()"
      (onReset)="resetForm()"
      (onSave)="patchHabit()"
    />
  }
</div>
